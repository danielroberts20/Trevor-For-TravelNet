services:
  trevor:
    build: .
    container_name: trevor
    mem_limit: 512m
    env_file: .env
    volumes:
      - ./app:/app                                           # bind-mount for dev (hot reload)
      - /mnt/ssd/docker/services/travelnet/data:/data:ro
      - /mnt/ssd/docker/services/Trevor/chroma:/chroma
      - /home/dan/services/TravelNet/travel.yml:/config/travel.yml:ro # SSOT for travel. Injected in to prompt.
    ports:
      - "8300:8300"
    restart: unless-stopped
    healthcheck:           # /docs is static; /health opens a Chroma client on every call, too heavy for a 30 s probe
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - travelnet

networks:
  travelnet:
    external: true      # defined by TravelNet's compose; Trevor just joins it
    name: travelnet
